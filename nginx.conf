# 静态站点用的 Nginx 配置。
#
# 关键点：next.config.ts 开了 trailingSlash，产物是 posts/x/index.html，
# 所以直接靠 try_files 的目录回退就能命中，不需要写 rewrite。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 带内容哈希的构建产物可以永久缓存
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 静态资源目录（见 src/lib/assets.ts）：文件名不变，缓存短一些，方便随时替换
    location ~ ^/(images|wallpapers|music|lyrics|uploads)/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # 目录式 URL：/posts/hello-world/ → /posts/hello-world/index.html
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ $uri.html =404;
    }

    # 兼容少数不带斜杠的旧链接
    location ~ ^/(.*[^/])$ {
        try_files $uri $uri/ $uri.html /$1/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/rss+xml font/woff2;

    # 静态托管不需要暴露版本号
    server_tokens off;
}
